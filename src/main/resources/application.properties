server.port=8080
spring.application.name=projeto-romaneio

# Configurações de upload de arquivos (suporte a planilhas grandes)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# Jackson
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Google Maps Platform. Configure Geocoding API + Routes API; never commit an API key.
romaneio.google.maps.api-key=${ROMANEIO_GOOGLE_MAPS_API_KEY:}
